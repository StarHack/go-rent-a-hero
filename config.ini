; Rent-A-Hero root project config

; Scene ID to load at startup
;init_scene = 7B
;init_scene = S1
;init_scene = S3
;init_scene = 114
;init_scene = 115
;init_scene = S10

; Stretch AVI cutscenes (including the launch intro) to fill the whole window instead of playing at their native size
stretch_video = 1

; Turn the real audio backend (internal/audio's Oto engine) on or off entirely
enable_sound = 1

; Open the game window in (borderless desktop) fullscreen
full_screen = 1

; Draw the green hotspot debug rectangles (the clickable interactive zones)
debug_hot_spots = 0

; Draw the current scene and location IDs in yellow at the top-left of the screen
debug_area = 0

